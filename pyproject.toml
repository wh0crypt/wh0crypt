[project]
name = "wh0crypt"
version = "0.1.0"
description = " Config files for my GitHub profile."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.0.2",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.4",
]

[dependency-groups]
dev = [
    {include-group = "lint"}
]
lint = [
    "black>=24.8.0",
    "isort>=5.13.2",
    "pre-commit>=3.5.0",
    "ruff>=0.14.4",
]

[tool.uv]
cache-dir = ".uv_cache"
python-downloads = "manual"
offline = false

[tool.black]
line-length = 88
target-version = ["py314"]
skip-string-normalization = false
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.ruff_cache
  | \.uv_cache
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = "wh0crypt"
combine_as_imports = true

[tool.ruff]
line-length = 88
target-version = "py314"
lint.select = ["E", "F", "W", "I"]
lint.ignore = ["E203", "E501"]
fix = true
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    ".ruff_cache",
    ".uv_cache",
]
